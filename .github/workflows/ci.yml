name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: brew install shellcheck
      - name: Lint
        run: shellcheck claude-usage.5m.sh install.sh uninstall.sh tests/run.sh
      - name: Render fixtures
        run: tests/run.sh
